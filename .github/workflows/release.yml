name: Build and publish Windows release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      WIN_CSC_LINK: ""
      WIN_CSC_KEY_PASSWORD: ""
    steps:
      - name: Record workflow start
        id: timing
        shell: pwsh
        run: |
          "started=$([DateTimeOffset]::UtcNow.ToString('o'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js from the project contract
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore dependencies
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund

      - name: Generate production renderer
        shell: pwsh
        run: |
          npm run prepare:renderer

      - name: Build unsigned Squirrel.Windows artifacts
        shell: pwsh
        run: |
          npm run dist:unsigned

      - name: Collect and verify release evidence
        id: evidence
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($packageVersion)) { throw 'The package version could not be resolved.' }
          $artifactDirectory = Join-Path $PWD 'dist/squirrel-windows'
          $setupName = "MaterialEncryption-Setup-$packageVersion-x64.exe"
          $fullPackageName = "material-encryption-$packageVersion-full.nupkg"
          $deltaPackageName = "material-encryption-$packageVersion-delta.nupkg"
          $setupPath = Join-Path $artifactDirectory $setupName
          $releaseIndex = Join-Path $artifactDirectory 'RELEASES'
          $fullPackagePath = Join-Path $artifactDirectory $fullPackageName
          $deltaPackagePath = Join-Path $artifactDirectory $deltaPackageName
          foreach ($requiredPath in @($setupPath, $releaseIndex, $fullPackagePath)) {
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) { throw "Required Squirrel.Windows artifact was not produced: $requiredPath" }
          }
          # The delta package is published when Squirrel produced one. It is not
          # required: generating it needs the previous release's package, and that
          # sync intermittently leaves a tail after the full package's zip
          # end-of-central-directory which Squirrel's own 7-Zip then rejects. A
          # delta is a download-size optimisation, so it is not worth failing a
          # release over. See issue #6.
          $hasDelta = Test-Path -LiteralPath $deltaPackagePath -PathType Leaf
          if (-not $hasDelta) { Write-Host '::warning::No delta package was produced; publishing the full package only.' }
          $unexpectedSetups = @(Get-ChildItem -LiteralPath $artifactDirectory -File -Filter '*Setup*.exe' | Where-Object Name -ne $setupName)
          if ($unexpectedSetups.Count -ne 0) { throw 'The Squirrel.Windows output contains an unexpected setup name.' }
          $releaseEntries = @(Get-Content -LiteralPath $releaseIndex | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $verifiedPackages = if ($hasDelta) { @($deltaPackageName, $fullPackageName) } else { @($fullPackageName) }
          foreach ($packageName in $verifiedPackages) {
            $escapedPackageName = [regex]::Escape($packageName)
            $matchingEntry = @($releaseEntries | Where-Object { $_ -match "^(?<sha>[A-Fa-f0-9]{40})\s+$escapedPackageName\s+(?<size>\d+)$" })
            if ($matchingEntry.Count -ne 1) { throw "RELEASES does not link the exact package name: $packageName" }
            $null = $matchingEntry[0] -match "^(?<sha>[A-Fa-f0-9]{40})\s+$escapedPackageName\s+(?<size>\d+)$"
            $packagePath = Join-Path $artifactDirectory $packageName
            $actualSha = (Get-FileHash -Algorithm SHA1 -LiteralPath $packagePath).Hash
            $actualSize = (Get-Item -LiteralPath $packagePath).Length
            if ($actualSha -ne $Matches.sha -or $actualSize -ne [long]$Matches.size) { throw "RELEASES integrity metadata does not match the package bytes: $packageName" }
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $setupPath
          if ($signature.Status -ne 'NotSigned') { throw "Installer signature state is $($signature.Status), expected NotSigned." }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setupPath).Hash
          $stage = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $setupPath -Destination $stage
          $publishedReleaseEntries = @($releaseEntries | Where-Object { ($hasDelta -and $_ -match "\s+$([regex]::Escape($deltaPackageName))\s+\d+$") -or $_ -match "\s+$([regex]::Escape($fullPackageName))\s+\d+$" })
          $expectedRowCount = if ($hasDelta) { 2 } else { 1 }
          if ($publishedReleaseEntries.Count -ne $expectedRowCount) { throw 'The current package rows could not be isolated for publication.' }
          Set-Content -LiteralPath (Join-Path $stage 'RELEASES') -Value $publishedReleaseEntries -Encoding ascii
          Copy-Item -LiteralPath $fullPackagePath -Destination $stage
          if ($hasDelta) { Copy-Item -LiteralPath $deltaPackagePath -Destination $stage }
          $dimSumName = 'hk-dish-0001-classic-har-gow.png'
          $dimSumUrl = "https://github.com/Ding-Ding-Projects/dim-sum-photos/releases/download/catalog-v1/$dimSumName"
          $dimSumPath = Join-Path $stage $dimSumName
          Invoke-WebRequest -Uri $dimSumUrl -OutFile $dimSumPath
          $pngSignature = [System.IO.File]::ReadAllBytes($dimSumPath)[0..7]
          if ([Convert]::ToHexString($pngSignature) -ne '89504E470D0A1A0A') { throw 'The selected dim-sum release asset is not a decodable PNG candidate.' }
          Add-Type -AssemblyName System.Drawing
          $dimSumImage = [System.Drawing.Image]::FromFile($dimSumPath)
          try {
            if ($dimSumImage.Width -lt 1 -or $dimSumImage.Height -lt 1) { throw 'The selected dim-sum release asset has invalid decoded dimensions.' }
          } finally {
            $dimSumImage.Dispose()
          }
          @{
            run_id = '${{ github.run_id }}'
            commit = '${{ github.sha }}'
            runner_os = '${{ runner.os }}'
            runner_arch = '${{ runner.arch }}'
            package_version = $packageVersion
            installer = $setupName
            installer_sha256 = $hash
            releases = 'RELEASES'
            full_package = $fullPackageName
            delta_package = if ($hasDelta) { $deltaPackageName } else { $null }
            delta_source = 'https://github.com/Ding-Ding-Projects/material-encryption'
            dim_sum_photo = $dimSumName
            dim_sum_source = $dimSumUrl
            signature = $signature.Status.ToString()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $stage 'build-evidence.json') -Encoding utf8
          $expectedAssets = @($setupName, 'RELEASES', $fullPackageName, 'build-evidence.json', $dimSumName)
          if ($hasDelta) { $expectedAssets += $deltaPackageName }
          $stagedAssets = @(Get-ChildItem -LiteralPath $stage -File | ForEach-Object Name | Sort-Object)
          if (Compare-Object ($expectedAssets | Sort-Object) $stagedAssets) { throw 'Release staging does not contain the exact required asset names.' }
          "stage=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "setup=$setupName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "package=$fullPackageName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "delta=$(if ($hasDelta) { $deltaPackageName } else { '' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "dim_sum=$dimSumName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Count project lines
        shell: pwsh
        run: |
          npm run count:lines | Tee-Object -FilePath "$env:RUNNER_TEMP/line-count.md"

      - name: Publish one immutable release for this run
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $run = gh run view '${{ github.run_id }}' --repo '${{ github.repository }}' --json jobs | ConvertFrom-Json
          $firstJob = $run.jobs | Sort-Object startedAt | Select-Object -First 1
          if (-not $firstJob.startedAt) { throw 'The first job start timestamp is unavailable.' }
          $started = [DateTimeOffset]::Parse($firstJob.startedAt)
          $packageVersion = node -p "require('./package.json').version"
          $tag = "v$packageVersion-build.${{ github.run_number }}"
          $lineCount = Get-Content -Raw "$env:RUNNER_TEMP/line-count.md"
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $assets = @(Get-ChildItem -LiteralPath '${{ steps.evidence.outputs.stage }}' -File | ForEach-Object FullName)
          $expectedAssetNames = @('${{ steps.evidence.outputs.setup }}', 'RELEASES', '${{ steps.evidence.outputs.delta }}', '${{ steps.evidence.outputs.package }}', 'build-evidence.json', '${{ steps.evidence.outputs.dim_sum }}') | Sort-Object
          $assetNames = @(Get-ChildItem -LiteralPath '${{ steps.evidence.outputs.stage }}' -File | ForEach-Object Name | Sort-Object)
          if (Compare-Object $expectedAssetNames $assetNames) { throw 'Release staging does not contain the exact required asset names.' }
          Set-Content -LiteralPath $notesPath -Value 'Draft release preparation.' -Encoding utf8
          gh release create $tag @assets --target "${{ github.sha }}" --title "Material Encryption $tag" --notes-file $notesPath --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          $drafts = gh api 'repos/${{ github.repository }}/releases?per_page=100' | ConvertFrom-Json
          $draft = @($drafts | Where-Object { $_.tag_name -eq $tag -and $_.draft })
          if ($draft.Count -ne 1) { throw 'The newly created draft release could not be identified uniquely.' }
          $releaseId = $draft[0].id
          $template = @'
          # Material Encryption __TAG__

          Windows-only unsigned Squirrel.Windows release built from __SHA__.

          ## Installer

          - __SETUP__
          - Full update package: __FULL__
          - Delta update package: __DELTA__
          - SHA-256: __HASH__
          - Signature: NotSigned

          > This installer is unsigned and may trigger an unknown-publisher or SmartScreen warning.

          ## Verification boundary

          This workflow builds, packages, verifies artifact structure, and publishes. Tests and lint are intentionally local-only and do not run in GitHub Actions. That means automation can publish a commit whose local tests were not run; the first protection is the recorded local release process.

          ## Workflow timing

          - Workflow started: __STARTED__
          - Workflow completed: __COMPLETED__
          - Workflow duration: __DURATION__

          ## Line count

          Reproduce with npm run count:lines.

          __LINE_COUNT__

          ## Dim sum code name

          Classic Har Gow · 蝦餃

          - Photo asset: __DIM_SUM__
          - Public catalog source: https://github.com/Ding-Ding-Projects/dim-sum-photos/releases/tag/catalog-v1
          '@
          $notes = $template.Replace('__TAG__', $tag).
            Replace('__SHA__', '${{ github.sha }}').
            Replace('__SETUP__', '${{ steps.evidence.outputs.setup }}').
            Replace('__FULL__', '${{ steps.evidence.outputs.package }}').
            Replace('__DELTA__', '${{ steps.evidence.outputs.delta }}').
            Replace('__DIM_SUM__', '${{ steps.evidence.outputs.dim_sum }}').
            Replace('__HASH__', '${{ steps.evidence.outputs.sha256 }}').
            Replace('__STARTED__', $started.ToUniversalTime().ToString('o')).
            Replace('__COMPLETED__', 'pending publication').
            Replace('__DURATION__', 'pending publication').
            Replace('__LINE_COUNT__', $lineCount.Trim())
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh api -X PATCH "repos/${{ github.repository }}/releases/$releaseId" -F "body=@$notesPath" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Draft release note finalization failed.' }
          gh api -X PATCH "repos/${{ github.repository }}/releases/$releaseId" -f "tag_name=$tag" -f "target_commitish=${{ github.sha }}" -F draft=false -f make_latest=true | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          $published = gh release view $tag --json body,targetCommitish,isDraft,isPrerelease,publishedAt,assets | ConvertFrom-Json
          $completed = [DateTimeOffset]::Parse($published.publishedAt)
          $duration = $completed - $started
          $notes = $notes.Replace('- Workflow completed: pending publication', '- Workflow completed: ' + $completed.ToUniversalTime().ToString('o'))
          $notes = $notes.Replace('- Workflow duration: pending publication', '- Workflow duration: ' + $duration.ToString('hh\:mm\:ss'))
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh release edit $tag --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'Published release timing finalization failed.' }
          $published = gh release view $tag --json body,targetCommitish,isDraft,isPrerelease,publishedAt,assets | ConvertFrom-Json
          if ($published.targetCommitish -ne '${{ github.sha }}' -or $published.isDraft -or $published.isPrerelease) { throw 'Published release metadata does not match the run.' }
          $publishedAssetNames = @($published.assets | ForEach-Object name | Sort-Object)
          if (Compare-Object $expectedAssetNames $publishedAssetNames) { throw 'Published release assets do not match the exact required names.' }
          $publishedProofDirectory = Join-Path $env:RUNNER_TEMP 'published-release-proof'
          New-Item -ItemType Directory -Force -Path $publishedProofDirectory | Out-Null
          gh release download $tag --pattern RELEASES --pattern '*.nupkg' --dir $publishedProofDirectory --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Published Squirrel.Windows update assets could not be downloaded for verification.' }
          $releaseIndexText = Get-Content -Raw -LiteralPath (Join-Path $publishedProofDirectory 'RELEASES')
          foreach ($packageName in @('${{ steps.evidence.outputs.delta }}', '${{ steps.evidence.outputs.package }}')) {
            $packagePath = Join-Path $publishedProofDirectory $packageName
            if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) { throw "Published package is missing: $packageName" }
            $escapedPackageName = [regex]::Escape($packageName)
            if ($releaseIndexText -notmatch "(?m)^(?<sha>[A-Fa-f0-9]{40})\s+$escapedPackageName\s+(?<size>\d+)\s*$") { throw "Published RELEASES does not link the exact published package: $packageName" }
            $actualSha = (Get-FileHash -Algorithm SHA1 -LiteralPath $packagePath).Hash
            $actualSize = (Get-Item -LiteralPath $packagePath).Length
            if ($actualSha -ne $Matches.sha -or $actualSize -ne [long]$Matches.size) { throw "Published RELEASES integrity metadata does not match the downloaded package: $packageName" }
          }
          if ($published.body -match '[\x00-\x08\x0B\x0C\x0E-\x1F]' -or $published.body -match '__[A-Z_]+__' -or $published.body -match '\$\(') { throw 'Published release notes contain control characters or unresolved placeholders.' }

      - name: Collect safe build outputs
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'workflow-evidence'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          if (Test-Path -LiteralPath '${{ steps.evidence.outputs.stage }}') {
            Copy-Item -LiteralPath '${{ steps.evidence.outputs.stage }}' -Destination $bundle -Recurse
          }
          @{
            run_id = '${{ github.run_id }}'
            commit = '${{ github.sha }}'
            job_status = '${{ job.status }}'
            runner_os = '${{ runner.os }}'
            runner_arch = '${{ runner.arch }}'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $bundle 'workflow-context.json') -Encoding utf8

      - name: Upload safe workflow outputs
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: material-encryption-${{ github.run_id }}
          path: ${{ runner.temp }}/workflow-evidence
          if-no-files-found: warn
          retention-days: 7
