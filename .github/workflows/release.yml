name: Build and publish Windows release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      WIN_CSC_LINK: ""
      WIN_CSC_KEY_PASSWORD: ""
    steps:
      - name: Record workflow start
        id: timing
        shell: pwsh
        run: |
          "started=$([DateTimeOffset]::UtcNow.ToString('o'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js from the project contract
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore dependencies
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund

      - name: Generate production renderer
        shell: pwsh
        run: |
          npm run prepare:renderer

      - name: Build unsigned Squirrel.Windows artifacts
        shell: pwsh
        run: |
          npm run dist

      - name: Collect and verify release evidence
        id: evidence
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Recurse -Filter *.exe | Where-Object { $_.Name -match 'Setup.*\.exe$' } | Select-Object -First 1
          if (-not $setup) { throw 'Setup.exe was not produced.' }
          $releaseIndex = Join-Path $setup.Directory.FullName 'RELEASES'
          $packages = @(Get-ChildItem -Path $setup.Directory.FullName -Filter *.nupkg)
          if (-not (Test-Path -LiteralPath $releaseIndex)) { throw 'RELEASES was not produced beside Setup.exe.' }
          if ($packages.Count -lt 1) { throw 'No Squirrel.Windows package was produced.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $setup.FullName
          if ($signature.Status -ne 'NotSigned') { throw "Installer signature state is $($signature.Status), expected NotSigned." }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup.FullName).Hash
          $stage = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $setup.FullName -Destination $stage
          Copy-Item -LiteralPath $releaseIndex -Destination $stage
          Copy-Item -LiteralPath $packages.FullName -Destination $stage
          @{
            run_id = '${{ github.run_id }}'
            commit = '${{ github.sha }}'
            runner_os = '${{ runner.os }}'
            runner_arch = '${{ runner.arch }}'
            installer = $setup.Name
            installer_sha256 = $hash
            signature = $signature.Status.ToString()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $stage 'build-evidence.json') -Encoding utf8
          "stage=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "setup=$($setup.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Count project lines
        shell: pwsh
        run: |
          npm run count:lines | Tee-Object -FilePath "$env:RUNNER_TEMP/line-count.md"

      - name: Publish one immutable release for this run
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $run = gh run view '${{ github.run_id }}' --repo '${{ github.repository }}' --json jobs | ConvertFrom-Json
          $firstJob = $run.jobs | Sort-Object startedAt | Select-Object -First 1
          if (-not $firstJob.startedAt) { throw 'The first job start timestamp is unavailable.' }
          $started = [DateTimeOffset]::Parse($firstJob.startedAt)
          $tag = "v0.1.${{ github.run_number }}"
          $lineCount = Get-Content -Raw "$env:RUNNER_TEMP/line-count.md"
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $assets = @(Get-ChildItem -LiteralPath '${{ steps.evidence.outputs.stage }}' -File | ForEach-Object FullName)
          if ($assets.Count -lt 4) { throw 'Release staging is incomplete.' }
          Set-Content -LiteralPath $notesPath -Value 'Draft release preparation.' -Encoding utf8
          gh release create $tag @assets --target "${{ github.sha }}" --title "Material Encryption $tag" --notes-file $notesPath --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          $drafts = gh api 'repos/${{ github.repository }}/releases?per_page=100' | ConvertFrom-Json
          $draft = @($drafts | Where-Object { $_.tag_name -eq $tag -and $_.draft })
          if ($draft.Count -ne 1) { throw 'The newly created draft release could not be identified uniquely.' }
          $releaseId = $draft[0].id
          $template = @'
          # Material Encryption __TAG__

          Windows-only unsigned Squirrel.Windows release built from __SHA__.

          ## Installer

          - __SETUP__
          - SHA-256: __HASH__
          - Signature: NotSigned

          > This installer is unsigned and may trigger an unknown-publisher or SmartScreen warning.

          ## Verification boundary

          This workflow builds, packages, verifies artifact structure, and publishes. Tests and lint are intentionally local-only and do not run in GitHub Actions. That means automation can publish a commit whose local tests were not run; the first protection is the recorded local release process.

          ## Workflow timing

          - Workflow started: __STARTED__
          - Workflow completed: __COMPLETED__
          - Workflow duration: __DURATION__

          ## Line count

          Reproduce with npm run count:lines.

          __LINE_COUNT__

          ## Dim sum code name

          No code name was assigned because this release workflow does not copy or fetch catalog assets during publishing.
          '@
          $notes = $template.Replace('__TAG__', $tag).
            Replace('__SHA__', '${{ github.sha }}').
            Replace('__SETUP__', '${{ steps.evidence.outputs.setup }}').
            Replace('__HASH__', '${{ steps.evidence.outputs.sha256 }}').
            Replace('__STARTED__', $started.ToUniversalTime().ToString('o')).
            Replace('__COMPLETED__', 'pending publication').
            Replace('__DURATION__', 'pending publication').
            Replace('__LINE_COUNT__', $lineCount.Trim())
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh api -X PATCH "repos/${{ github.repository }}/releases/$releaseId" -F "body=@$notesPath" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Draft release note finalization failed.' }
          gh api -X PATCH "repos/${{ github.repository }}/releases/$releaseId" -F draft=false -f make_latest=true | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          $published = gh release view $tag --json body,targetCommitish,isDraft,isPrerelease,publishedAt,assets | ConvertFrom-Json
          $completed = [DateTimeOffset]::Parse($published.publishedAt)
          $duration = $completed - $started
          $notes = $notes.Replace('- Workflow completed: pending publication', '- Workflow completed: ' + $completed.ToUniversalTime().ToString('o'))
          $notes = $notes.Replace('- Workflow duration: pending publication', '- Workflow duration: ' + $duration.ToString('hh\:mm\:ss'))
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh release edit $tag --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'Published release timing finalization failed.' }
          $published = gh release view $tag --json body,targetCommitish,isDraft,isPrerelease,publishedAt,assets | ConvertFrom-Json
          if ($published.targetCommitish -ne '${{ github.sha }}' -or $published.isDraft -or $published.isPrerelease) { throw 'Published release metadata does not match the run.' }
          if ($published.assets.Count -lt 4) { throw 'Published release assets are incomplete.' }
          if ($published.body -match '[\x00-\x08\x0B\x0C\x0E-\x1F]' -or $published.body -match '__[A-Z_]+__' -or $published.body -match '\$\(') { throw 'Published release notes contain control characters or unresolved placeholders.' }

      - name: Collect safe build outputs
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'workflow-evidence'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          if (Test-Path -LiteralPath '${{ steps.evidence.outputs.stage }}') {
            Copy-Item -LiteralPath '${{ steps.evidence.outputs.stage }}' -Destination $bundle -Recurse
          }
          @{
            run_id = '${{ github.run_id }}'
            commit = '${{ github.sha }}'
            job_status = '${{ job.status }}'
            runner_os = '${{ runner.os }}'
            runner_arch = '${{ runner.arch }}'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $bundle 'workflow-context.json') -Encoding utf8

      - name: Upload safe workflow outputs
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: material-encryption-${{ github.run_id }}
          path: ${{ runner.temp }}/workflow-evidence
          if-no-files-found: warn
          retention-days: 7
